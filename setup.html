<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>설정</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="topbar"><a href="./"><button class="ghost">◀ 목차</button></a><h1>이 기기 설정</h1></div>
<div class="wrap" style="max-width:640px">
  <p class="msg" style="text-align:left">숙제 사진과 음성은 비공개 GitHub 레포에 저장돼요. 이 기기에서 보려면 그 레포 하나만 읽고 쓸 수 있는 토큰을 한 번 넣어 주세요. 토큰은 이 기기 브라우저에만 저장돼요.</p>
  <div class="field">
    <label>GitHub 토큰 (fine-grained)</label>
    <input id="token" type="password" autocomplete="off" placeholder="github_pat_…">
    <p class="msg" style="text-align:left;padding:6px 0 0"><a href="https://github.com/settings/personal-access-tokens/new?name=noah-reader-ipad&description=noah-reader+data+repo+access&contents=write&expires_in=366" target="_blank" rel="noopener"><u>토큰 만들기</u></a> → Repository access: Only select repositories → 데이터 레포 선택 (권한 Contents 쓰기는 링크에 미리 채워져 있음)</p>
  </div>
  <div class="field">
    <label>데이터 레포</label>
    <input id="repo" type="text" autocomplete="off">
  </div>
  <div id="err" class="err" style="display:none"></div>
  <div id="ok" class="msg" style="display:none"></div>
  <div class="row"><button id="clear">이 기기에서 지우기</button><button id="save" class="primary">저장하고 확인</button></div>
</div>
<script src="common.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const c = cfg();
$('#token').value = c.token || '';
$('#repo').value = c.repo || DEFAULT_REPO;
const show = (el, msg) => { $('#err').style.display = 'none'; $('#ok').style.display = 'none'; el.textContent = msg; el.style.display = 'block'; };
$('#save').onclick = async () => {
  const token = $('#token').value.trim(), repo = $('#repo').value.trim();
  if (!token) return show($('#err'), '토큰을 넣어 주세요.');
  saveCfg({ ...cfg(), token, repo });
  try {
    const r = await gh(`/repos/${repo}`);
    if (!r.ok) throw new Error(r.status === 404 ? '레포를 찾을 수 없어요. 토큰의 Repository access에 이 레포가 있는지 확인하세요.' : `GitHub ${r.status}`);
    show($('#ok'), '✅ 연결됐어요. 목차로 이동합니다…');
    const next = new URLSearchParams(location.search).get('next');
    setTimeout(() => { location.href = next && /^[a-z]+\.html(\?.*)?$/.test(next) ? next : './'; }, 800);
  } catch (e) { show($('#err'), e.message); }
};
$('#clear').onclick = () => { saveCfg({}); $('#token').value = ''; show($('#ok'), '이 기기에서 토큰을 지웠어요.'); };
</script>
</body>
</html>
