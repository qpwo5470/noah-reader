<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>읽기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="topbar">
  <a href="./"><button class="ghost">◀ 목차</button></a>
  <h1 id="title">불러오는 중…</h1>
  <button id="togglePhoto" class="ghost">📷 사진</button>
  <button id="edit" class="ghost">✏️</button>
</div>
<div class="reader">
  <img id="photo" class="photo" alt="">
  <div id="status"></div>
  <div id="text" class="text"></div>
</div>
<audio id="audio" preload="auto"></audio>

<div class="controls" id="controls" style="display:none">
  <div class="hint" id="hint">단어를 누르면 거기부터 읽어요</div>
  <div class="r">
    <button id="prev">◀ 이전 문장</button>
    <button id="play" class="primary play">▶ 읽기</button>
    <button id="next">다음 문장 ▶</button>
  </div>
  <div class="r">
    <button id="slow">🐢 천천히</button>
    <button id="slower" style="max-width:64px">－</button>
    <div class="speed" id="speed">1.0×</div>
    <button id="faster" style="max-width:64px">＋</button>
    <button id="fast">🐇 빠르게</button>
  </div>
  <div class="r">
    <button id="loopSent">🔁 이 문장 반복</button>
    <button id="loopAB">🅰🅱 구간 정하기</button>
    <button id="loopOff">반복 끄기</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="in">
    <h2 style="margin-top:0">텍스트 수정 후 음성 다시 만들기</h2>
    <p class="msg" style="padding:0 0 10px;text-align:left">글자가 잘못 읽혔으면 고치고 "다시 만들기"를 누르세요.</p>
    <div class="field"><label>제목</label><input id="editTitle" type="text"></div>
    <div class="field"><label>본문</label><textarea id="editText"></textarea></div>
    <div id="editErr" class="err" style="display:none"></div>
    <div class="row"><button id="editCancel">취소</button><button id="editSave" class="primary">🔊 다시 만들기</button></div>
  </div>
</div>

<script src="common.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id') || '';
const $ = (s) => document.querySelector(s);
const audio = $('#audio');
let page = null, words = [], wordEls = [], sentEls = new Map();
let loop = null;            // {start, end, kind:'sent'|'ab', si}
let abMode = false, abA = null;
let curIdx = -1;
const SPEEDS = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2, 1.3, 1.5];
let rate = Number(localStorage.getItem('noah.rate') || 1.0);

const REGEN_KEY = `noah.regen.${id}`;
function waiting(msg) {
  $('#status').innerHTML = `<div class="spinner"></div><div class="msg">${msg}<br><small>보통 1~3분 걸려요. 이 화면을 열어 두면 끝나는 대로 바뀌어요.</small></div>`;
  setTimeout(() => load().catch(showErr), 6000);
}
async function load() {
  page = await getJson(`pages/${id}/page.json`);
  if (!page) {
    const inbox = await listDir('inbox');
    if (inbox.some((f) => f.startsWith(id + '.'))) { $('#title').textContent = '새 페이지'; return waiting('🔍 사진을 받아서 글자를 읽는 중…'); }
    throw new Error('페이지를 찾지 못했어요. 지워졌을 수 있어요.');
  }
  $('#title').textContent = page.title;
  getBlobUrl(`pages/${id}/page.jpg`).then((u) => { $('#photo').src = u; }).catch(() => {});
  const regenFrom = localStorage.getItem(REGEN_KEY);
  if (regenFrom && page.updatedAt === regenFrom) {
    if (page.text) renderText(page.text, []);
    return waiting('🔊 음성을 다시 만드는 중…');
  }
  localStorage.removeItem(REGEN_KEY);
  if (page.status === 'processing') { if (page.text) renderText(page.text, []); return waiting('🔊 음성을 만드는 중…'); }
  if (page.status === 'error') {
    $('#status').innerHTML = `<div class="err"></div><div class="msg">✏️ 버튼으로 텍스트를 확인하고 다시 만들 수 있어요.</div>`;
    $('#status .err').textContent = '만들지 못했어요.\n' + (page.error || '');
    if (page.text) renderText(page.text, []);
    return;
  }
  $('#status').innerHTML = '';
  words = page.words;
  renderText(page.text, words);
  audio.src = await getBlobUrl(`pages/${id}/${page.audio}`);
  setRate(rate);
  $('#controls').style.display = 'grid';
  if (!window.__ticking) { window.__ticking = true; requestAnimationFrame(tick); }
}

// 텍스트의 줄바꿈을 살리면서 단어 토큰을 words[]와 1:1로 매칭
function renderText(text, words) {
  const box = $('#text');
  box.innerHTML = ''; wordEls = []; sentEls = new Map();
  const tokens = text.split(/\s+/).filter(Boolean);
  const aligned = words.length === tokens.length;
  let wi = 0;
  const lines = aligned ? text.split('\n') : [words.map((w) => w.w).join(' ') || text];
  let curSentEl = null, curSi = -1;
  for (const line of lines) {
    const lineEl = document.createElement('span');
    lineEl.className = 'line';
    for (const tok of line.split(/\s+/).filter(Boolean)) {
      const w = words[wi] || { w: tok, si: 0 };
      if (words.length && w.si !== curSi) {
        curSi = w.si;
        curSentEl = document.createElement('span');
        curSentEl.className = 'sent'; curSentEl.dataset.si = curSi;
        sentEls.set(curSi, [...(sentEls.get(curSi) || []), curSentEl]);
      } else if (!curSentEl || curSentEl.parentNode !== lineEl) {
        curSentEl = document.createElement('span');
        curSentEl.className = 'sent'; curSentEl.dataset.si = curSi;
        if (words.length) sentEls.set(curSi, [...(sentEls.get(curSi) || []), curSentEl]);
      }
      if (curSentEl.parentNode !== lineEl) lineEl.appendChild(curSentEl);
      const el = document.createElement('span');
      el.className = 'w'; el.textContent = tok; el.dataset.i = wi;
      el.addEventListener('click', () => onWordTap(Number(el.dataset.i)));
      curSentEl.appendChild(el);
      curSentEl.appendChild(document.createTextNode(' '));
      wordEls.push(el);
      wi++;
    }
    box.appendChild(lineEl);
  }
}

function indexAt(t) {
  let lo = 0, hi = words.length - 1, ans = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (words[m].s <= t) { ans = m; lo = m + 1; } else hi = m - 1; }
  return ans;
}

function tick() {
  if (words.length) {
    const t = audio.currentTime;
    if (loop && !audio.paused && t >= loop.end - 0.02) { audio.currentTime = loop.start; }
    const i = indexAt(audio.currentTime);
    if (i !== curIdx) setCurrent(i);
  }
  requestAnimationFrame(tick);
}

function setCurrent(i) {
  if (curIdx >= 0 && wordEls[curIdx]) wordEls[curIdx].classList.remove('cur');
  curIdx = i;
  const el = wordEls[i];
  document.querySelectorAll('.sent.cur').forEach((s) => s.classList.remove('cur'));
  if (!el) return;
  el.classList.add('cur');
  (sentEls.get(words[i].si) || []).forEach((s) => s.classList.add('cur'));
  const r = el.getBoundingClientRect();
  const bottomLimit = window.innerHeight - $('#controls').offsetHeight - 40;
  if (r.top < 80 || r.bottom > bottomLimit) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function sentenceRange(si) {
  const idx = words.map((w, i) => (w.si === si ? i : -1)).filter((i) => i >= 0);
  if (!idx.length) return null;
  return { start: words[idx[0]].s, end: words[idx[idx.length - 1]].e + 0.15, si, first: idx[0], last: idx[idx.length - 1] };
}

function onWordTap(i) {
  if (abMode) {
    if (abA === null) {
      abA = i; wordEls[i].classList.add('a');
      $('#hint').textContent = '끝 단어를 누르세요';
      return;
    }
    const a = Math.min(abA, i), b = Math.max(abA, i);
    clearMarks();
    for (let k = a; k <= b; k++) wordEls[k].classList.add('inrange');
    loop = { start: words[a].s, end: words[b].e + 0.15, kind: 'ab' };
    abMode = false; abA = null;
    $('#loopAB').classList.remove('on');
    $('#loopAB').textContent = '🅰🅱 구간 정하기';
    $('#hint').textContent = `"${words[a].w} … ${words[b].w}" 반복 중`;
    audio.currentTime = loop.start; play();
    return;
  }
  if (loop && loop.kind === 'sent' && words[i].si !== loop.si) setSentenceLoop(words[i].si);
  if (loop && loop.kind === 'ab' && (words[i].s < loop.start || words[i].s > loop.end)) loopOff();
  audio.currentTime = words[i].s;
  play();
}

function clearMarks() {
  $('#text').classList.remove('abmode');
  document.querySelectorAll('.w.a, .w.b, .w.inrange').forEach((e) => e.classList.remove('a', 'b', 'inrange'));
  document.querySelectorAll('.sent.loop').forEach((e) => e.classList.remove('loop'));
}

function setSentenceLoop(si) {
  const r = sentenceRange(si); if (!r) return;
  clearMarks();
  loop = { ...r, kind: 'sent' };
  (sentEls.get(si) || []).forEach((s) => s.classList.add('loop'));
  $('#loopSent').classList.add('on');
  $('#hint').textContent = `${si + 1}번째 문장 반복 중 · 다른 문장을 누르면 그 문장을 반복해요`;
}

function loopOff() {
  loop = null; abMode = false; abA = null;
  clearMarks();
  $('#loopSent').classList.remove('on');
  $('#loopAB').classList.remove('on');
  $('#loopAB').textContent = '🅰🅱 구간 정하기';
  $('#hint').textContent = '단어를 누르면 거기부터 읽어요';
}

function play() { audio.play().catch(() => {}); }
function setRate(r) {
  rate = Math.min(1.5, Math.max(0.5, Math.round(r * 10) / 10));
  audio.playbackRate = rate;
  try { audio.preservesPitch = true; audio.mozPreservesPitch = true; audio.webkitPreservesPitch = true; } catch (e) {}
  $('#speed').textContent = rate.toFixed(1) + '×';
  localStorage.setItem('noah.rate', rate);
  $('#slow').classList.toggle('on', rate === 0.7);
  $('#fast').classList.toggle('on', rate === 1.2);
}

$('#play').onclick = () => { if (audio.paused) { if (audio.ended || (loop && audio.currentTime >= loop.end)) audio.currentTime = loop ? loop.start : 0; play(); } else audio.pause(); };
audio.addEventListener('play', () => { $('#play').textContent = '⏸ 멈춤'; });
audio.addEventListener('pause', () => { $('#play').textContent = '▶ 읽기'; });
audio.addEventListener('ended', () => { if (loop) { audio.currentTime = loop.start; play(); } });
$('#prev').onclick = () => {
  const i = Math.max(0, curIdx);
  const si = words[i] ? words[i].si : 0;
  const r = sentenceRange(si);
  // 문장 시작 1초 이후면 현재 문장 처음으로, 아니면 이전 문장으로
  const target = (r && audio.currentTime - r.start > 1.0) ? si : Math.max(0, si - 1);
  jumpSentence(target);
};
$('#next').onclick = () => { const si = words[curIdx] ? words[curIdx].si : -1; jumpSentence(si + 1); };
function jumpSentence(si) {
  const r = sentenceRange(si); if (!r) return;
  if (loop && loop.kind === 'sent') setSentenceLoop(si);
  else if (loop && loop.kind === 'ab') loopOff();
  audio.currentTime = r.start; play();
}
$('#slow').onclick = () => setRate(0.7);
$('#fast').onclick = () => setRate(1.2);
$('#slower').onclick = () => setRate(rate - 0.1);
$('#faster').onclick = () => setRate(rate + 0.1);
$('#loopSent').onclick = () => {
  if (loop && loop.kind === 'sent') return loopOff();
  const si = words[Math.max(0, curIdx)] ? words[Math.max(0, curIdx)].si : 0;
  setSentenceLoop(si);
  const r = sentenceRange(si);
  if (audio.currentTime < r.start || audio.currentTime > r.end) audio.currentTime = r.start;
  play();
};
$('#loopAB').onclick = () => {
  if (abMode) { abMode = false; abA = null; clearMarks(); $('#loopAB').classList.remove('on'); $('#loopAB').textContent = '🅰🅱 구간 정하기'; $('#hint').textContent = '단어를 누르면 거기부터 읽어요'; return; }
  loopOff(); abMode = true; audio.pause();
  $('#loopAB').classList.add('on'); $('#loopAB').textContent = '취소';
  $('#hint').textContent = '시작 단어를 누르세요';
  $('#text').classList.add('abmode');
};
$('#loopOff').onclick = loopOff;
$('#togglePhoto').onclick = () => $('#photo').classList.toggle('show');

// 텍스트 수정
$('#edit').onclick = () => {
  if (!page) return;
  $('#editTitle').value = page.title; $('#editText').value = page.text || '';
  $('#editErr').style.display = 'none';
  $('#sheet').classList.add('show');
};
$('#editCancel').onclick = () => $('#sheet').classList.remove('show');
$('#editSave').onclick = async () => {
  const btn = $('#editSave'); btn.disabled = true;
  try {
    const text = $('#editText').value.trim();
    if (!text) throw new Error('본문이 비어 있어요.');
    await putJson(`inbox/${id}.regen.json`, { id, text, title: $('#editTitle').value.trim() }, `regen ${id}`);
    localStorage.setItem(REGEN_KEY, page.updatedAt);
    $('#sheet').classList.remove('show'); audio.pause(); $('#controls').style.display = 'none';
    load().catch(showErr);
  } catch (e) { $('#editErr').textContent = e.message; $('#editErr').style.display = 'block'; }
  btn.disabled = false;
};

function showErr(e) { $('#status').innerHTML = '<div class="err"></div>'; $('#status .err').textContent = e.message; }
if (requireSetup()) load().catch(showErr);
</script>
</body>
</html>
