<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>새 페이지 만들기</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="topbar"><a href="./"><button class="ghost">◀ 목차</button></a><h1>새 페이지 만들기</h1></div>
<div class="wrap" style="max-width:640px">
  <div class="field">
    <label>숙제 사진</label>
    <input id="file" type="file" accept="image/*" capture="environment" hidden>
    <input id="file2" type="file" accept="image/*" hidden>
    <div class="row">
      <button class="bigbtn primary" id="shoot">📷 사진 찍기</button>
      <button class="bigbtn" id="pick">🖼 앨범에서</button>
    </div>
    <img id="preview" class="preview" alt="" style="display:none">
  </div>
  <div class="field">
    <label>비밀번호</label>
    <input id="pw" type="password" inputmode="numeric" placeholder="새 페이지 비밀번호" autocomplete="off">
    <label class="remember"><input id="remember" type="checkbox"> 이 기기에 기억하기</label>
  </div>
  <div id="err" class="err" style="display:none"></div>
  <button class="bigbtn primary" id="go" disabled>✨ 음성 만들기</button>
  <p class="msg">사진을 올리면 글자를 읽고 음성을 만들어요. 1~3분쯤 걸려요.</p>
</div>
<script src="common.js"></script>
<script>
requireSetup();
const file = document.getElementById('file'), file2 = document.getElementById('file2');
const preview = document.getElementById('preview'), go = document.getElementById('go'), err = document.getElementById('err');
let chosen = null;
// 실수 방지용 잠금(보안 아님): 데이터 접근은 설정의 토큰이 결정한다
const PW_HASH = '07c4b46160c71a2135063b4c47638ce816fc99968dbce0e52faec985bbbb27fd';
const PW_KEY = 'noah.uploadPw';
const pw = document.getElementById('pw'), remember = document.getElementById('remember');
try { pw.value = localStorage.getItem(PW_KEY) || ''; } catch (e) {}
remember.checked = !!pw.value;
async function sha256(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join(''); }
document.getElementById('shoot').onclick = () => file.click();
document.getElementById('pick').onclick = () => file2.click();
for (const inp of [file, file2]) inp.addEventListener('change', () => {
  chosen = inp.files[0] || null;
  if (!chosen) return;
  preview.src = URL.createObjectURL(chosen); preview.style.display = 'block';
  go.disabled = false;
});
// 긴 변 2000px JPEG로 줄여 base64로 (HEIC도 브라우저가 디코드하면 JPEG로 바뀜)
async function toJpegBase64(f) {
  const img = new Image();
  img.src = URL.createObjectURL(f);
  await img.decode();
  const scale = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const dataUrl = c.toDataURL('image/jpeg', 0.88);
  return dataUrl.slice(dataUrl.indexOf(',') + 1);
}
go.onclick = async () => {
  err.style.display = 'none';
  if (!chosen) return;
  if (await sha256(pw.value.trim()) !== PW_HASH) { err.textContent = '비밀번호가 틀렸어요.'; err.style.display = 'block'; try { localStorage.removeItem(PW_KEY); } catch (e) {} return; }
  try { remember.checked ? localStorage.setItem(PW_KEY, pw.value.trim()) : localStorage.removeItem(PW_KEY); } catch (e) {}
  go.disabled = true; go.textContent = '올리는 중…';
  try {
    const id = newId();
    await putFile(`inbox/${id}.jpg`, await toJpegBase64(chosen), `upload ${id}`);
    location.href = `reader.html?id=${id}`;
  } catch (e) {
    err.textContent = e.message; err.style.display = 'block';
    go.disabled = false; go.textContent = '✨ 음성 만들기';
  }
};
</script>
</body>
</html>
